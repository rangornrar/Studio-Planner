name: JavaScript checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Syntaxe de tous les scripts de l'application et du Labo photo
      - run: npm run lint
      # Tests unitaires : traductions et moteur du Labo photo
      - run: npm test
