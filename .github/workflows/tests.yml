name: JavaScript checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check js/simple-studio.js
      - run: node --check js/studio-locales.js
      - run: node --test tests/*.test.cjs
